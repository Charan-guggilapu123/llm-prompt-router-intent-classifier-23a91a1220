services:
  prompt-router:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_CLASSIFIER: ${OPENAI_MODEL_CLASSIFIER:-gpt-4o-mini}
      OPENAI_MODEL_GENERATION: ${OPENAI_MODEL_GENERATION:-gpt-4o-mini}
      INTENT_CONFIDENCE_THRESHOLD: ${INTENT_CONFIDENCE_THRESHOLD:-0.7}
      MOCK_LLM: ${MOCK_LLM:-true}
      PORT: ${PORT:-3000}
      ROUTE_LOG_PATH: ${ROUTE_LOG_PATH:-route_log.jsonl}